name: kokoro-fastapi-npu
services:
  kokoro-tts:
    build:
      context: ../..
      dockerfile: docker/npu/Dockerfile
    volumes:
      - ../../api:/app/api
      # Mount the host Ascend driver so the container can communicate with the NPU
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
    # Ascend NPU device files required for CANN / torch_npu
    devices:
      - /dev/davinci0
      - /dev/davinci_manager
      - /dev/devmm_svm
      - /dev/hisi_hdc
    ports:
      - "8880:8880"
    environment:
      - PYTHONPATH=/app:/app/api
      - USE_GPU=true
      - DEVICE_TYPE=npu:0
      - PYTHONUNBUFFERED=1
      # Restrict visibility to NPU device 0 (comma-separate for multiple NPUs, e.g. "0,1")
      - ASCEND_RT_VISIBLE_DEVICES=0
      - API_LOG_LEVEL=DEBUG

